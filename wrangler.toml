name = "woonam"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 데이터베이스 바인딩
# 로컬 개발: `npm run d1:migrate:local` / 운영: `npm run d1:migrate:remote`
[[d1_databases]]
binding = "DB"
database_name = "woonam-reservations"
database_id = "34704691-0cff-44a9-88b6-01fb5878ded3"

# 아래 값들은 커밋하지 말고 Cloudflare 대시보드(Worker 설정 > Variables and Secrets) 또는
# `npx wrangler secret put <이름>` 으로 등록하세요. 로컬 개발용은 .dev.vars 참고.
# - SOLAPI_API_KEY
# - SOLAPI_API_SECRET
# - SOLAPI_SENDER_NUMBER   (Solapi에 등록된 발신번호, 예: 0212345678)
# - OWNER_PHONE            (점주 알림 수신 번호, 예: 01012345678)
# - TOKEN_SECRET           (OTP 해시/토큰 서명용 임의의 긴 문자열)
